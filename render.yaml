# Render Blueprint: BambooKit Web as a static site (Next.js static export in ./out).
services:
  - type: web
    name: bambookit-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      # Public, build-time values (inlined into the static bundle by `next build`).
      - key: NEXT_PUBLIC_API_URL
        value: https://bambookit-api.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://skvjitpcpwfprgxvnpdd.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Optional Google sign-in: set all three to show the Google button.
      # - key: NEXT_PUBLIC_FIREBASE_API_KEY
      #   sync: false
      # - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
      #   sync: false
      # - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
      #   sync: false
    routes:
      # One static page serves every share link; it reads the id from the URL.
      - type: rewrite
        source: /share/*
        destination: /share/index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
